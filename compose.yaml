name: dskt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dskt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dskt-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-dskt}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dskt} -d ${POSTGRES_DB:-dskt}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - dskt-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./dskt-backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-dskt}:${POSTGRES_PASSWORD:-dskt-local-only}@postgres:5432/${POSTGRES_DB:-dskt}
      CORS_ORIGIN: http://localhost:8080
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 15s

  frontend:
    build:
      context: ./dskt-frontend
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dskt-postgres:
