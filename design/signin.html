<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSKT Sign In</title>
<link rel="stylesheet" href="assets/dskt.css">
<style>
  body { min-height: 100%; }
  .split { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  @media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr); } .art { display: none; } }
  .art { position: relative; background: var(--canvas); border-right: 1px solid var(--line); overflow: hidden; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .cap { position: absolute; left: 32px; bottom: 28px; right: 32px; display: flex; justify-content: space-between; gap: 16px; font: 400 12px var(--f-mono); color: var(--ink-3); flex-wrap: wrap; }
  .side-in { display: flex; flex-direction: column; padding: 32px 16px; }
  .side-in .inner { margin: auto; width: min(380px, 100%); display: flex; flex-direction: column; gap: 22px; }
  .wordmark { display: flex; align-items: center; gap: 10px; }
  .wordmark .brand-mark { width: 34px; height: 34px; }
  .wordmark b { font: 700 24px/1 var(--f-cond); letter-spacing: 0.08em; }
  .hero { font: 600 34px/1.1 var(--f-cond); letter-spacing: -0.01em; text-wrap: balance; }
  .ms { height: 44px; font-size: 15px; width: 100%; gap: 10px; }
  .states { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); align-items: center; border-top: 1px solid var(--line); padding-top: 14px; }
  .states button { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 4px 10px; font: 500 12px var(--f-sans); cursor: pointer; }
  .states button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="split">
  <div class="art" aria-hidden="true">
    <svg id="art"></svg>
    <div class="cap"><span>NOIDA, TOWER B, FLOOR 3, r13</span><span>1 unit = 10 cm, 48 × 30 m</span></div>
  </div>
  <main class="side-in">
    <div class="inner" id="panel"></div>
  </main>
</div>
<script src="assets/dskt.js"></script>
<script>
(function () {
  const D = DSKT;
  const svg = D.setupMap(document.getElementById("art"));
  svg.setAttribute("viewBox", "-20 -20 520 340");
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.classList.add("lod-low");
  D.renderFloor(svg, { mode: "workplace", placements: D.PLACEMENTS, status: (p) => D.spaceStatus(p) });
  let g = ""; for (let x = 0; x <= 480; x += 16) g += `M${x} 0V300`; for (let y = 0; y <= 300; y += 16) g += `M0 ${y}H480`;
  svg.querySelector(".layer-grid").innerHTML = `<path class="grid-minor" d="${g}"/>`;

  const mark = `<svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><rect class="bm-bg" x="1" y="1" width="24" height="24" rx="1"/><path class="bm-line" d="M6 6h14v8h-5v6H6z"/><rect class="bm-desk" x="9" y="9" width="5" height="2.6"/></svg>`;
  const msLogo = `<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>`;
  const STATES = {
    signin: () => `
      <p class="hero">Floor plans and seating for Arrise offices.</p>
      <p class="muted">Sign in with your Arrise Microsoft account to view floors, find colleagues and manage spaces.</p>
      <button class="btn ms" id="go">${msLogo} Sign in with Microsoft</button>
      <p class="hint">Access depends on the DSKT role you’ve been given. Ask the Workplace team if you need one.</p>`,
    loading: () => `
      <p class="hero">Signing you in…</p>
      <button class="btn ms" disabled><span class="spinner"></span> Waiting for Microsoft</button>
      <p class="hint">Finish signing in in the Microsoft window. This page continues by itself.</p>`,
    denied: () => `
      <div class="callout warn"><svg class="ico"><use href="#i-lock"/></svg><div>You’re signed in, but you don’t have a DSKT role yet.</div></div>
      <p class="muted">Signed in as <span class="mono">priya.menon@arrise.example</span>. Roles are granted by the DSKT system administrators, not through Microsoft groups.</p>
      <dl class="kv"><dt>Request access</dt><dd><span class="mono">workplace-help@arrise.example</span></dd><dt>Include</dt><dd>Your name and which role you need: Viewer, Workplace Planner or Facilities Admin</dd></dl>
      <div class="row"><button class="btn" id="back"><svg class="ico"><use href="#i-logout"/></svg> Sign out</button></div>`,
    tenant: () => `
      <div class="callout crit"><svg class="ico"><use href="#i-alert"/></svg><div>This account isn’t part of Arrise.</div></div>
      <p class="muted">DSKT accepts Arrise Microsoft accounts only. You signed in with <span class="mono">priya@outlook.com</span>.</p>
      <div class="row"><button class="btn btn-primary" id="back">${msLogo} Use a different account</button></div>`,
    expired: () => `
      <div class="callout info"><svg class="ico"><use href="#i-clock"/></svg><div>Your session ended. Sign in again to continue. Draft changes were saved before it ended.</div></div>
      <button class="btn ms" id="go">${msLogo} Sign in again</button>`,
  };
  const LABELS = { signin: "Sign in", loading: "Signing in", denied: "No role", tenant: "Wrong tenant", expired: "Session ended" };
  let state = "signin";
  function render() {
    document.getElementById("panel").innerHTML = `<div class="wordmark">${mark}<b>DSKT</b><span class="subtle" style="font-size:13px">for Arrise</span></div>${STATES[state]()}
      <div class="states" role="group" aria-label="Preview screen state"><span>Preview state:</span>${Object.keys(STATES).map((k) => `<button data-s="${k}" aria-pressed="${k === state}">${LABELS[k]}</button>`).join("")}</div>`;
    document.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => { state = b.dataset.s; render(); }));
    const go = document.getElementById("go"); if (go) go.onclick = () => { state = "loading"; render(); setTimeout(() => { location.href = "locations.html"; }, 1400); };
    const back = document.getElementById("back"); if (back) back.onclick = () => { state = "signin"; render(); };
  }
  render();
})();
</script>
</body>
</html>
